services:
  spark-iceberg:
    image: tabulario/spark-iceberg
    container_name: spark-iceberg
    env_file:
      - .env
    networks:
      iceberg_net:
    depends_on:
      - rest
      - minio
    volumes:
      - ./warehouse:/home/iceberg/warehouse
      - ./:/home/iceberg/project
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
      AWS_REGION: ${MINIO_REGION}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      ICEBERG_REST_URI: ${ICEBERG_REST_URI}
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE}
      ICEBERG_CATALOG: ${ICEBERG_CATALOG}
    ports:
      - "8888:8888"
      - "8180:8080"
      - "10000:10000"
      - "10001:10001"

  rest:
    image: apache/iceberg-rest-fixture
    container_name: iceberg-rest
    env_file:
      - .env
    networks:
      iceberg_net:
    ports:
      - "8181:8181"
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
      AWS_REGION: ${MINIO_REGION}
      CATALOG_WAREHOUSE: ${ICEBERG_WAREHOUSE}
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: ${MINIO_ENDPOINT}
      # RustFS is addressed path-style (http://minio:9000/<bucket>/...)
      CATALOG_S3_PATH__STYLE__ACCESS: "true"

  # The original minio/minio image was removed from Docker Hub in Sept 2026.
  # RustFS is an S3-compatible replacement. Service/container name stays
  # "minio" so the endpoint http://minio:9000 and all other configs still work.
  minio:
    image: rustfs/rustfs:latest
    container_name: minio
    env_file:
      - .env
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs-data:/data
    networks:
      iceberg_net:
        aliases:
          - warehouse.minio
    ports:
      - "9001:9001"
      - "9000:9000"

  # minio/mc was also removed. rustfs/rc is the matching client; this container
  # creates the bucket once and then exits.
  mc:
    image: rustfs/rc:latest
    container_name: mc
    env_file:
      - .env
    depends_on:
      - minio
    networks:
      iceberg_net:
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - |
        until /usr/bin/rc alias set rustfs http://minio:9000 "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}" --region us-east-1 --bucket-lookup path; do
          echo "waiting for object storage..."
          sleep 2
        done
        until /usr/bin/rc bucket create rustfs/${MINIO_BUCKET} --ignore-existing; do
          echo "retrying bucket creation..."
          sleep 2
        done
        echo "bucket ready"

  trino:
    image: trinodb/trino:481
    container_name: trino
    env_file:
      - .env
    networks:
      iceberg_net:
    depends_on:
      - rest
      - minio
    ports:
      - "${TRINO_PORT}:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog

  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: airflow
    depends_on:
      - spark-iceberg
      - trino
    networks:
      iceberg_net:
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./:/opt/airflow/project
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8081:8080"
    command: standalone

volumes:
  rustfs-data:

networks:
  iceberg_net: